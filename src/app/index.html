<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0E0E0E">
  <title>Fynest Studio - Creative Digital Marketing Solutions</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  
  <style>
    /* Prevent white flash on load - applies immediately before any JavaScript */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0E0E0E;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Mobile optimizations */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      /* Prevent text size adjustment on orientation change */
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      /* Support for notched devices */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    
    #root {
      background-color: #0E0E0E;
      width: 100%;
      height: 100%;
      /* Mobile optimizations */
      position: relative;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    
    /* Loading screen that shows immediately */
    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #0E0E0E;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      /* Mobile optimizations */
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      will-change: opacity;
    }
    
    #initial-loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      text-align: center;
    }
    
    #initial-loader h1 {
      font-family: 'Bebas Neue', 'Arial Black', sans-serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 12vw, 7rem);
      letter-spacing: 0.15em;
      color: #FFFFFF;
      margin: 0;
      line-height: 1;
    }
    
    #initial-loader p {
      font-family: 'Inter', 'Arial', sans-serif;
      font-weight: 300;
      font-size: clamp(0.75rem, 2.5vw, 1.125rem);
      letter-spacing: 0.05em;
      color: #FFFFFF;
      opacity: 0.6;
      margin: 0;
    }
    
    /* Mobile-specific loading screen adjustments */
    @media (max-width: 767px) {
      #initial-loader-content {
        gap: 0.5rem;
        padding: 1.5rem;
      }
      
      #initial-loader h1 {
        font-size: clamp(2rem, 10vw, 3.5rem);
      }
      
      #initial-loader p {
        font-size: clamp(0.7rem, 2vw, 0.9rem);
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Initial loader that shows immediately, before React loads -->
  <div id="initial-loader">
    <div id="initial-loader-content">
      <h1>FYNEST STUDIO</h1>
      <p>Because average isn't fynest</p>
    </div>
  </div>
  
  <div id="root"></div>
  
  <script>
    // Remove initial loader once React takes over
    // Only show on first load, not on subsequent navigations
    if (!sessionStorage.getItem('fynest_initial_load')) {
      sessionStorage.setItem('fynest_initial_load', 'true');
      
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.transition = 'opacity 0.5s ease-out';
            loader.style.opacity = '0';
            setTimeout(function() {
              loader.style.display = 'none';
            }, 500);
          }
        }, 100);
      });
    } else {
      // Hide immediately if already shown this session
      var loader = document.getElementById('initial-loader');
      if (loader) {
        loader.style.display = 'none';
      }
    }
  </script>
  
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
